services:
  # Development service - what you use for daily development
  dev:
    build:
      context: .
      target: dev
    ports:
      - '3001:3000'
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev

  # Build the files that GitHub Pages serves from docs/
  deploy:
    build:
      context: .
      target: deploy
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    profiles:
      - deploy
